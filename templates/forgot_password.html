<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Magnetise Media</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            overflow: hidden;
        }
        .custom-cursor {
            width: 8px; height: 8px; background: rgba(0,0,0,0.6);
            border-radius: 50%; position: fixed;
            pointer-events: none; z-index: 9999; opacity: 0;
        }
        .page-wrapper { position: relative; z-index: 10; width: 100%; max-width: 500px; }
        .card {
            background: #0a0a0a;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px; padding: 52px 48px;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 20px 60px rgba(0,0,0,0.35);
        }
        .top-brand {
            position: fixed;
            top: 5px; right: 16px;
            display: flex; align-items: center; gap: -2px;
            color: #0a0a0a; font-weight: 700; font-size: 18px; z-index: 100;
        }
        .top-brand img { width: 74px; height: 74px; margin-right: -16px; }
        .card-header { text-align: center; margin-bottom: 36px; }
        .card-header img { width: 148px; height: 148px; margin-bottom: -20px; filter: brightness(0) invert(1); object-fit: contain; }
        .card-header h1 { color: #ffffff; font-size: 30px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
        .card-header p { color: #bbbbbb; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #ccc; font-weight: 500; font-size: 13px; margin-bottom: 8px; }
        .form-group input {
            width: 100%; background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
            padding: 13px 16px; color: #fff; font-family: 'Inter', sans-serif; font-size: 14px; transition: all 0.25s;
        }
        .form-group input::placeholder { color: rgba(255,255,255,0.3); }
        .form-group input:focus { outline: none; border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.09); }
        .msg-box { border-radius: 10px; padding: 12px 14px; font-size: 13px; margin-bottom: 16px; display: none; line-height: 1.5; }
        .msg-box.error { background: rgba(255,68,68,0.12); border: 1px solid rgba(255,68,68,0.3); color: #ff8080; }
        .msg-box.success { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #fff; }

        /* BUTTONS — same as login */
        .btn-primary {
            position: relative; overflow: hidden; width: 100%;
            background: transparent; color: #ffffff;
            border: 1.5px solid rgba(255,255,255,0.2);
            border-radius: 10px; padding: 14px;
            font-weight: 700; font-size: 15px;
            cursor: pointer; font-family: 'Inter', sans-serif;
            transition: transform 0.2s, color 0.2s, border-color 0.2s;
            z-index: 1; margin-bottom: 12px;
        }
        .btn-primary::after {
            content: ''; position: absolute;
            bottom: -100%; left: 0;
            width: 100%; height: 100%;
            background: #ffffff;
            transition: bottom .45s cubic-bezier(.77,0,.18,1);
            z-index: -1;
        }
        .btn-primary:hover::after { bottom: 0; }
        .btn-primary:hover { color: #000; border-color: #fff; transform: translateY(-2px); }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .btn-ghost {
            position: relative; overflow: hidden; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: transparent; border: 1.5px solid rgba(255,255,255,0.25);
            color: #ccc; border-radius: 10px;
            padding: 12px; font-size: 15px; font-weight: 600;
            cursor: pointer; font-family: 'Inter', sans-serif;
            transition: border-color 0.2s, color 0.2s;
            z-index: 1;
        }
        .btn-ghost::after {
            content: ''; position: absolute;
            top: 0; left: 100%;
            width: 100%; height: 100%;
            background: #ffffff;
            transition: left .45s cubic-bezier(.77,0,.18,1);
            z-index: -1;
        }
        .btn-ghost:hover::after { left: 0; }
        .btn-ghost:hover { border-color: #fff; color: #000; }

        /* Success state */
        .success-state { text-align: center; display: none; }
        .success-icon {
            width: 64px; height: 64px; border-radius: 50%;
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
            display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
        }
        .success-icon svg { color: #ffffff; }
        .success-state h2 { color: #fff; font-size: 22px; font-weight: 700; margin-bottom: 10px; }
        .success-state p { color: #aaaaaa; font-size: 14px; line-height: 1.7; margin-bottom: 28px; }

        @media (max-width: 520px) {
            .card { padding: 36px 24px; border-radius: 20px; }
            .card-header h1 { font-size: 24px; }
            .card-header img { width: 80px; height: 80px; }
            .top-brand { font-size: 15px; }
            .top-brand img { width: 44px; height: 44px; }
        }
    </style>
</head>
<body>
<div class="custom-cursor" id="cursor"></div>

<div class="page-wrapper">
    <div class="top-brand">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Magnetise Media Logo">
        <span>Magnetise Media</span>
    </div>
    <div class="card">
        <div class="card-header">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Magnetise Media Logo">
            <h1>Reset Password</h1>
            <p>Enter your registered email to receive a secure reset code</p>
        </div>

        <!-- FORM STATE -->
        <div id="formState">
            <div id="msgBox" class="msg-box"></div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="emailInput" placeholder="Enter your registered email" autocomplete="email"/>
            </div>
            <button class="btn-primary" id="submitBtn" onclick="submitRequest()">Send Reset Request</button>
            <button class="btn-ghost" onclick="window.location.href='/client-login'">
                <span>←</span> Back
            </button>
        </div>

        <!-- SUCCESS STATE -->
        <div class="success-state" id="successState">
            <div class="success-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
            </div>

            <h2>Verification Required</h2>

            <p>
                We've sent a 6-digit verification code to your email address.
            </p>

            <div class="form-group" style="margin-top:22px;">
                <label>Verification Code</label>
                <input type="text" id="otpInput" placeholder="Enter 6-digit code" maxlength="6"/>
            </div>

            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPasswordInput" placeholder="Enter new password"/>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPasswordInput" placeholder="Confirm new password"/>
            </div>

            <button class="btn-primary" id="resetBtn" onclick="resetPassword()">
                Reset Password
            </button>

            <button class="btn-ghost" onclick="window.location.href='/client-login'">
                <span>←</span> Back to Login
            </button>
        </div>
    </div>
</div>

<script>
function showMsg(text, type) {
    const b = document.getElementById('msgBox');
    b.textContent = text;
    b.className = 'msg-box ' + type;
    b.style.display = 'block';
}

async function submitRequest() {
    const email = document.getElementById('emailInput').value.trim();
    if (!email || !email.includes('@')) { showMsg('Please enter a valid email address.', 'error'); return; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Sending...';

    try {
        const res = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (data.success) {
            window.resetEmail = email;
            document.getElementById('formState').style.display = 'none';
            document.getElementById('successState').style.display = 'block';
        } else {
            showMsg(data.message || 'Something went wrong.', 'error');
            btn.disabled = false;
            btn.textContent = 'Send Verification Code';
        }
    } catch {
        showMsg('Connection error. Please try again.', 'error');
        btn.disabled = false;
        btn.textContent = 'Send Reset Request';
    }
}

document.getElementById('emailInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitRequest();
});

async function resetPassword() {

    const otp = document.getElementById('otpInput').value.trim();
    const newPassword = document.getElementById('newPasswordInput').value.trim();
    const confirmPassword = document.getElementById('confirmPasswordInput').value.trim();

    if (!otp || otp.length !== 6) {
        alert('Enter valid 6-digit OTP');
        return;
    }

    if (newPassword.length < 8) {
        alert('Password must be at least 8 characters');
        return;
    }

    if (newPassword !== confirmPassword) {
        alert('Passwords do not match');
        return;
    }

    const btn = document.getElementById('resetBtn');

    btn.disabled = true;
    btn.textContent = 'Resetting...';

    try {

        const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                email: window.resetEmail,
                otp: otp,
                new_password: newPassword
            })
        });

        const data = await res.json();

        if (data.success) {

            alert('Password reset successful. Please login.');

            window.location.href = '/client-login';

        } else {

            alert(data.message || 'Reset failed');

            btn.disabled = false;
            btn.textContent = 'Reset Password';
        }

    } catch {

        alert('Connection error');

        btn.disabled = false;
        btn.textContent = 'Reset Password';
    }
}

// Greyscale animated tube background — identical to login page
(function(){
    const s = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 1000);
    cam.position.set(0, 0, 12);
    const r = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    r.setSize(innerWidth, innerHeight);
    r.setPixelRatio(Math.min(devicePixelRatio, 2));
    const c = r.domElement;
    c.style.cssText = 'position:fixed;top:0;left:0;z-index:0;pointer-events:none;opacity:0.78;';
    document.body.appendChild(c);
    const mat = new THREE.ShaderMaterial({
        uniforms: { uTime:{value:0} },
        vertexShader: `varying vec2 vUv;varying vec3 vNormal;void main(){vUv=uv;vNormal=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
        fragmentShader: `uniform float uTime;varying vec2 vUv;varying vec3 vNormal;void main(){float flow=sin(vUv.x*6.28318+uTime*1.2)*.5+.5;float grey=mix(0.04,0.18,flow);vec3 color=vec3(grey);float fresnel=pow(1.-abs(dot(vNormal,vec3(0,0,1))),2.);color+=vec3(fresnel*0.08);float alpha=smoothstep(0.,.15,vUv.x)*smoothstep(1.,.85,vUv.x);gl_FragColor=vec4(color,alpha*.95);}`,
        transparent:true, side:THREE.DoubleSide
    });
    let ribbon, t=0;
    function pts(tf){const p=[];for(let i=0;i<150;i++){const t2=i/150;p.push(new THREE.Vector3((t2-.5)*30,Math.sin(t2*Math.PI*2.5+tf*.3)*6,Math.cos(t2*Math.PI*1.2+tf*.2)*3));}return p;}
    ribbon=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts(0)),150,2.5,32,false),mat);
    s.add(ribbon);
    s.add(new THREE.AmbientLight(0x222222,0.25));
    window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);});
    (function loop(){requestAnimationFrame(loop);t+=.004;ribbon.geometry.dispose();ribbon.geometry=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts(t)),150,2.5,32,false);mat.uniforms.uTime.value=t;ribbon.rotation.y=Math.sin(t*.15)*.2;ribbon.rotation.x=Math.cos(t*.1)*.1;cam.position.x=Math.sin(t*.12)*2;cam.position.y=Math.cos(t*.08)*1;cam.lookAt(0,0,0);r.render(s,cam);})();
})();

const cursorEl = document.getElementById('cursor');
let mx=0,my=0,cx=0,cy=0,onPage=false;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;if(!onPage){cx=mx;cy=my;onPage=true;}});
document.addEventListener('mouseleave',()=>{cursorEl.style.opacity='0';onPage=false;});
document.addEventListener('mouseenter',()=>{cursorEl.style.opacity='1';onPage=true;});
(function ac(){cx+=(mx-cx)*.08;cy+=(my-cy)*.08;cursorEl.style.left=cx-4+'px';cursorEl.style.top=cy-4+'px';const m=20;cursorEl.style.opacity=(mx<m||mx>window.innerWidth-m||my<m||my>window.innerHeight-m||!onPage)?'0':'1';requestAnimationFrame(ac);})();
</script>
</body>
</html>
