<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Magnetise Media</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            overflow: hidden;
        }

        .custom-cursor {
            width: 8px;
            height: 8px;
            background: #111;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
        }

        .page-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .top-brand {
            position: fixed;
            top: 12px;
            right: 16px;
            display: flex;
            align-items: center;
            color: #111;
            font-weight: 600;
            font-size: 18px;
            z-index: 100;
        }

        .top-brand img { width: 54px; height: 54px; margin-right: -6px; }

        .card {
            background: #ffffff;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 28px;
            padding: 52px 48px;
            width: 100%;
            max-width: 460px;
            box-shadow:
                0 4px 6px rgba(0,0,0,0.04),
                0 20px 60px rgba(0,0,0,0.08),
                inset 0 1px 0 rgba(255,255,255,0.9);
        }

        .card-header { text-align: center; margin-bottom: 32px; }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,0,0,0.06);
            border: 1px solid rgba(255,0,0,0.25);
            border-radius: 20px;
            padding: 5px 14px;
            color: #cc0000;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 18px;
            letter-spacing: 0.05em;
        }

        .admin-badge svg { width: 13px; height: 13px; }

        .card-header h1 {
            color: #111;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .card-header p { color: #777; font-size: 14px; }

        .form-group { margin-bottom: 20px; }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 500;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            background: #f9f9f9;
            border: 1px solid rgba(0,0,0,0.14);
            border-radius: 12px;
            padding: 13px 16px;
            color: #111;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: .25s ease;
        }

        .form-group input::placeholder { color: rgba(0,0,0,0.35); }

        .form-group input:focus {
            outline: none;
            border-color: #111;
            background: #fff;
            box-shadow: none;
        }

        .pw-wrap { position: relative; }
        .pw-wrap input { padding-right: 48px; }

        .pw-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(0,0,0,0.45);
            cursor: pointer;
            padding: 4px;
        }

        .pw-toggle:hover { color: #111; }

        .msg-box {
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            line-height: 1.5;
        }

        .msg-box.error {
            background: rgba(255,68,68,0.07);
            border: 1px solid rgba(255,68,68,0.35);
            color: #cc0000;
        }

        .msg-box.success {
            background: rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.15);
            color: #111;
        }

        /* BUTTON — slide fill animation preserved, just black/white */
        .btn-primary {
            position: relative;
            overflow: hidden;
            width: 100%;
            background: transparent;
            color: #111;
            border: 1.5px solid #111;
            border-radius: 12px;
            padding: 14px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            z-index: 1;
            font-family: 'Inter', sans-serif;
            transition: color .35s ease, transform .25s ease;
        }

        .btn-primary::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: #111;
            transition: left .4s ease;
            z-index: -1;
        }

        .btn-primary:hover::before { left: 0; }

        .btn-primary:hover {
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

        .security-note {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,0,0,0.05);
            border: 1px solid rgba(255,0,0,0.18);
            border-radius: 10px;
            padding: 12px 14px;
            margin-top: 20px;
        }

        .security-note svg { width: 16px; height: 16px; color: #cc0000; flex-shrink: 0; }
        .security-note p { color: #555; font-size: 12px; line-height: 1.5; }

        /* BACK HOME — slide fill animation preserved */
        .back-home {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            margin-top: 14px;
            border: 1.5px solid #111;
            border-radius: 12px;
            color: #111;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            z-index: 1;
            transition: color .35s ease;
        }

        .back-home::before {
            content: "";
            position: absolute;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100%;
            background: #111;
            transition: right .4s ease;
            z-index: -1;
        }

        .back-home:hover::before { right: 0; }
        .back-home:hover { color: #fff; }
    </style>
</head>
<body>
<div class="custom-cursor" id="cursor"></div>

<div class="page-wrapper">
    <div class="top-brand">
        <div class="logo-wrap">
            <img src="{{ url_for('static', filename='logo.png') }}">
        </div>
        <span>Magnetise Media</span>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="admin-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
                Admin Access
            </div>
            <h1>Admin Panel</h1>
            <p>Magnetise Media internal dashboard</p>
        </div>

        <div class="msg-box" id="msgBox"></div>

        <div class="form-group">
            <label>Admin Email</label>
            <input type="email" id="emailInput" placeholder="admin@magnetise.media" autocomplete="email" onkeydown="if(event.key==='Enter') document.getElementById('passwordInput').focus()"/>
        </div>
        <div class="form-group">
            <label>Password</label>
            <div class="pw-wrap">
                <input type="password" id="passwordInput" placeholder="Enter admin password" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()"/>
                <button class="pw-toggle" onclick="togglePwd()" type="button">
                    <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </div>

        <button class="btn-primary" id="loginBtn" onclick="doLogin()">Access Dashboard</button>

        <div class="security-note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <p>This page is for Magnetise Media team only. Unauthorized access attempts are logged.</p>
        </div>

        <a href="/" class="back-home">
            <span>←</span>
            <span>Back to Home</span>
        </a>
    </div>
</div>

<script>
/* ── THREE.JS RIBBON — black tube on white bg ── */
let scene, camera, renderer, ribbon, time = 0;

function init3D() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 12);
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, precision: 'highp' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    const c = renderer.domElement;
    c.style.cssText = 'position:fixed;top:0;left:0;z-index:0;pointer-events:none;opacity:0.55;';
    document.body.appendChild(c);
    createRibbon();
    scene.add(new THREE.AmbientLight(0x111111, 1));
    const l1 = new THREE.PointLight(0x333333, 2, 25);   l1.position.set(-8,5,8);  scene.add(l1);
    const l2 = new THREE.PointLight(0x222222, 1.5, 25); l2.position.set(8,-5,8);  scene.add(l2);
    const l3 = new THREE.PointLight(0x444444, 1.5, 20); l3.position.set(0,0,10);  scene.add(l3);
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    loop();
}

function makePts(t_off) {
    const pts = [];
    for (let i = 0; i < 150; i++) {
        const t = i/150;
        pts.push(new THREE.Vector3(
            (t-.5)*30,
            Math.sin(t*Math.PI*2.5 + t_off*.3)*6,
            Math.cos(t*Math.PI*1.2 + t_off*.2)*3
        ));
    }
    return pts;
}

function createRibbon() {
    const mat = new THREE.ShaderMaterial({
        uniforms: {
            uTime:  { value: 0 },
            uBlue1: { value: new THREE.Color(0x0a0a0a) },
            uBlue2: { value: new THREE.Color(0x141414) },
            uCyan:  { value: new THREE.Color(0x222222) },
            uDark:  { value: new THREE.Color(0x000000) }
        },
        vertexShader: `varying vec2 vUv;varying vec3 vNormal;void main(){vUv=uv;vNormal=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
        fragmentShader: `uniform float uTime;uniform vec3 uBlue1,uBlue2,uCyan,uDark;varying vec2 vUv;varying vec3 vNormal;void main(){float flow=sin(vUv.x*6.28318+uTime*1.2)*.5+.5;vec3 color=mix(uDark,uBlue1,vUv.x);color=mix(color,uBlue2,flow);color=mix(color,uCyan,pow(flow,2.)*.6);float fresnel=pow(1.-abs(dot(vNormal,vec3(0,0,1))),2.);color+=uCyan*fresnel*.5;float rg=pow(1.-abs(vUv.y*2.-1.),1.5);color+=vec3(rg*.3);color+=uCyan*(sin(vUv.x*12.56+uTime*2.)*.5+.5)*.2;float alpha=smoothstep(0.,.15,vUv.x)*smoothstep(1.,.85,vUv.x);gl_FragColor=vec4(color,alpha*.95);}`,
        transparent: true,
        side: THREE.DoubleSide
    });
    ribbon = new THREE.Mesh(
        new THREE.TubeGeometry(new THREE.CatmullRomCurve3(makePts(0)), 150, 2.5, 32, false),
        mat
    );
    scene.add(ribbon);
}

function loop() {
    requestAnimationFrame(loop);
    time += .004;
    ribbon.geometry.dispose();
    ribbon.geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(makePts(time)), 150, 2.5, 32, false);
    ribbon.material.uniforms.uTime.value = time;
    ribbon.rotation.y = Math.sin(time*.15)*.2;
    ribbon.rotation.x = Math.cos(time*.1)*.1;
    camera.position.x = Math.sin(time*.12)*2;
    camera.position.y = Math.cos(time*.08)*1;
    camera.lookAt(0,0,0);
    renderer.render(scene, camera);
}
init3D();

/* ── CURSOR ── */
const cursorEl = document.getElementById('cursor');
let mx=0, my=0, cx=0, cy=0, onPage=false;
document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; if(!onPage){cx=mx;cy=my;onPage=true;} });
document.addEventListener('mouseleave', () => { cursorEl.style.opacity='0'; onPage=false; });
document.addEventListener('mouseenter', () => { cursorEl.style.opacity='1'; onPage=true; });
(function ac(){
    cx += (mx-cx)*.08; cy += (my-cy)*.08;
    cursorEl.style.left = cx-4+'px';
    cursorEl.style.top  = cy-4+'px';
    const m = 20;
    cursorEl.style.opacity = (mx<m||mx>window.innerWidth-m||my<m||my>window.innerHeight-m||!onPage) ? '0' : '1';
    requestAnimationFrame(ac);
})();

/* ── LOGIN LOGIC — untouched ── */
function showMsg(t, type) { const b=document.getElementById('msgBox'); b.textContent=t; b.className='msg-box '+type; b.style.display='block'; }
function hideMsg() { document.getElementById('msgBox').style.display='none'; }
function setBtn(loading) { const b=document.getElementById('loginBtn'); b.disabled=loading; b.textContent=loading?'Please wait...':'Access Dashboard'; }

async function doLogin() {
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    hideMsg();
    if (!email || !password) { showMsg('Please enter both email and password.', 'error'); return; }
    setBtn(true);
    try {
        const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        let data;
        try { data = await res.json(); } catch { throw new Error('Invalid server response'); }
        if (res.ok && data.success) {
            showMsg('Access granted. Loading dashboard...', 'success');
            setTimeout(() => { window.location.href = '/admin/dashboard'; }, 800);
        } else {
            showMsg(data.message || 'Invalid admin credentials.', 'error');
        }
    } catch (err) {
        console.error(err);
        showMsg('Connection error. Make sure the server is running.', 'error');
    } finally {
        setBtn(false);
    }
}

function togglePwd() {
    const inp = document.getElementById('passwordInput');
    const icon = document.getElementById('eyeIcon');
    if (inp.type === 'password') {
        inp.type = 'text';
        icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
    } else {
        inp.type = 'password';
        icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    }
}
</script>
</body>
</html>
